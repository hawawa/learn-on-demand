version: 2

models:
  - name: fct_orders
    description: "Order-level fact model containing customer details, order dates, and total successful payment amounts."
    columns:
      - name: order_id
        description: "Primary key for each order."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Foreign key referencing the customer who placed the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_date
        description: "Date when the order was placed."

      - name: amount
        description: "Total amount of successful payments for the order, defaulted to 0 if unpaid."
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                row_condition: "order_id is not null"
                strictly: false
          - dbt_expectations.expect_column_mean_to_be_between:
              arguments:
                min_value: 1
                row_condition: "order_id is not null"
                strictly: false
          - average_dollars_spent_greater_than_one:
              arguments:
                group_by_column: customer_id